<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8a5a32"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Qwixx Würfel</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}body{background:#8a5a32;background-image:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.03),rgba(255,255,255,.02));background-size:64px 100%,100% 9px}#board{position:fixed;inset:0;padding-top:max(105px,calc(env(safe-area-inset-top) + 70px));padding-bottom:max(35px,env(safe-area-inset-bottom));display:grid;grid-template-rows:repeat(3,1fr);align-items:center}.row{display:flex;justify-content:center;gap:62px;align-items:center}.die{width:108px;height:108px;border-radius:21px;box-shadow:0 9px 15px #0008,inset 0 2px 4px #fff7;transition:transform .32s,opacity .25s;touch-action:manipulation;user-select:none;-webkit-user-select:none}.face{width:100%;height:100%;position:relative;border-radius:21px}.pip{position:absolute;width:17px;height:17px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 1px 2px #0008}.die.removed{opacity:0;pointer-events:none}#newGame{position:fixed;right:24px;top:max(18px,env(safe-area-inset-top));z-index:5;border:0;background:rgba(0,0,0,.18);color:#fff;border-radius:16px;height:54px;padding:0 18px;font-size:17px;font-weight:650}#hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;opacity:.62;white-space:nowrap}#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#111d;padding:13px 18px;border-radius:14px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}#toast.show{opacity:1}@media(max-width:390px){.die{width:98px;height:98px}.row{gap:48px}.pip{width:16px;height:16px}}</style></head><body>
<button id="newGame">Neustart</button><div id="board"><div class="row"><div class="die" data-id="white1"></div><div class="die" data-id="white2"></div></div><div class="row"><div class="die color" data-id="red"></div><div class="die color" data-id="yellow"></div></div><div class="row"><div class="die color" data-id="green"></div><div class="die color" data-id="blue"></div></div></div><div id="hint">Tippen = würfeln · Farbwürfel lange halten = herausnehmen</div><div id="toast"></div>
<script>
const C={white1:{hex:'#f5f4ed',pip:'#222',name:'Weiß'},white2:{hex:'#f5f4ed',pip:'#222',name:'Weiß'},red:{hex:'#ed1c24',pip:'#fff',name:'Rot'},yellow:{hex:'#ffd21c',pip:'#222',name:'Gelb'},green:{hex:'#16aa4b',pip:'#fff',name:'Grün'},blue:{hex:'#176fd1',pip:'#fff',name:'Blau'}};const P={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,25],[72,25],[28,50],[72,50],[28,75],[72,75]]};let removed=JSON.parse(localStorage.getItem('qwixxRemoved')||'[]'),longPress=false,timer=null;
function face(n,c){let f=document.createElement('div');f.className='face';f.style.background=c.hex;P[n].forEach(([x,y])=>{let p=document.createElement('i');p.className='pip';p.style.left=x+'%';p.style.top=y+'%';p.style.background=c.pip;f.appendChild(p)});return f}
function state(){document.querySelectorAll('.die').forEach(d=>d.classList.toggle('removed',removed.includes(d.dataset.id)))}
function roll(){if(longPress){longPress=false;return}document.querySelectorAll('.die:not(.removed)').forEach(d=>{let n=1+Math.floor(Math.random()*6),c=C[d.dataset.id],a=-18+Math.random()*36;d.innerHTML='';d.appendChild(face(n,c));d.style.transform=`rotate(${a+300}deg) scale(.88)`;requestAnimationFrame(()=>d.style.transform=`rotate(${a}deg) scale(1)`)});if(navigator.vibrate)navigator.vibrate(30)}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),900)}
document.querySelectorAll('.die').forEach(d=>{let c=C[d.dataset.id];d.appendChild(face(1+Math.floor(Math.random()*6),c));if(d.classList.contains('color')){let start=e=>{e.preventDefault();longPress=false;timer=setTimeout(()=>{longPress=true;if(!removed.includes(d.dataset.id)){removed.push(d.dataset.id);localStorage.setItem('qwixxRemoved',JSON.stringify(removed));state();if(navigator.vibrate)navigator.vibrate([45,35,45]);toast(c.name+' herausgenommen')}},850)},stop=()=>{clearTimeout(timer);timer=null};d.addEventListener('touchstart',start,{passive:false});d.addEventListener('touchend',stop);d.addEventListener('touchcancel',stop)}});
document.querySelector('#board').addEventListener('click',()=>{if(!longPress)roll();else longPress=false});document.querySelector('#newGame').onclick=e=>{e.stopPropagation();if(confirm('Neues Spiel starten? Alle Farbwürfel werden wieder eingesetzt.')){removed=[];localStorage.setItem('qwixxRemoved','[]');state();roll()}};state();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
